<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mau Jalan Sama Aku?</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #FFE4EC 0%, #FFD6E0 50%, #FFC0CB 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .bg-heart {
            position: absolute;
            color: #FF6B9D;
            animation: floatUp 10s infinite linear;
            z-index: 0;
            filter: drop-shadow(0 0 5px rgba(255, 107, 157, 0.5));
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(255, 182, 193, 0.4);
            text-align: center;
            z-index: 10;
            max-width: 350px;
            width: 90%;
            position: relative;
            border: 3px solid #FFE4EC;
        }

        h1 {
            color: #FF6B9D;
            font-size: 26px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 14px 35px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-yes {
            background: linear-gradient(135deg, #FF9EBB 0%, #FF6B9D 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.4);
        }

        .btn-no {
            background: linear-gradient(135deg, #E8E8E8 0%, #D4D4D4 100%);
            color: #666;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .success-page {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .date-container {
            width: 100%;
            margin-bottom: 15px;
        }

        .date-label {
            display: block;
            text-align: left;
            color: #FF6B9D;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .date-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #FFE4EC;
            border-radius: 15px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            color: #555;
            background: #FFF9FB;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .date-input:hover, .date-input:focus {
            border-color: #FF6B9D;
            outline: none;
            box-shadow: 0 0 15px rgba(255, 107, 157, 0.2);
        }

        .message-input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 15px;
            border: 2px solid #FFE4EC;
            resize: none;
            font-family: inherit;
            font-size: 14px;
            background: #FFF9FB;
            color: #555;
            transition: all 0.3s ease;
        }

        .message-input:focus {
            outline: none;
            border-color: #FF6B9D;
            box-shadow: 0 0 15px rgba(255, 107, 157, 0.2);
        }

        .message-input::placeholder {
            color: #BBB;
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            top: -10px;
            z-index: 20;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); top: 100%; opacity: 0; }
        }

        .card::before {
            content: '💝';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            animation: bounce 5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }

        /* Loading animation */
        .loading {
            display: none;
            color: #FF6B9D;
            font-size: 14px;
            margin-top: 10px;
        }

        .loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="bg-heart" style="left: 5%; animation-duration: 7s; font-size: 25px;"><i class="fas fa-heart"></i></div>
    <div class="bg-heart" style="left: 20%; animation-duration: 11s; font-size: 15px;"><i class="fas fa-heart"></i></div>
    <div class="bg-heart" style="left: 35%; animation-duration: 9s; font-size: 20px;"><i class="fas fa-heart"></i></div>
    <div class="bg-heart" style="left: 50%; animation-duration: 13s; font-size: 18px;"><i class="fas fa-heart"></i></div>
    <div class="bg-heart" style="left: 65%; animation-duration: 8s; font-size: 22px;"><i class="fas fa-heart"></i></div>
    <div class="bg-heart" style="left: 80%; animation-duration: 12s; font-size: 16px;"><i class="fas fa-heart"></i></div>
    <div class="bg-heart" style="left: 95%; animation-duration: 10s; font-size: 24px;"><i class="fas fa-heart"></i></div>

    <div class="card">
        
        <div id="question-page">
            <div style="font-size: 50px; margin-bottom: 15px;">💭</div>
            <h1>Mau jalan bareng?</h1>
            <p>please mau ya?🥺</p>
            
            <div class="btn-container">
                <button class="btn btn-yes" onclick="Accepted()">Mau!</button>
                <button class="btn btn-no" id="btnNo" onmouseover="runAway()" onclick="runAway()">gamau</button>
            </div>
        </div>

        <div id="success-page" class="success-page">
            <div class="success-icon">💗</div>
            <h1 style="color: #FF6B9D;">YES! BENERAN NIH?</h1>
            <p>mau tanggal berapa?</p>
            
            <div style="width: 100%; margin-top: 20px;">
                <div class="date-container">
                    <label class="date-label">📅 Pilih Tanggal:</label>
                    <input type="date" id="datePicker" class="date-input" required>
                </div>
                
                <textarea class="message-input" id="messageInput" placeholder="kamu ada tempat yang mau dituju?" rows="3"></textarea>
                <button class="btn btn-yes" style="margin-top: 10px; width: 100%;" onclick="kirimJawaban()" id="kirimBtn">Kirim</button>
                
                <div class="loading" id="loading">
                    <i class="fas fa-spinner"></i> Mengirim...
                </div>
            </div>
        </div>

    </div>

    <script>
        
        (function() {
            emailjs.init("NrGWBxQIGbqh8GdNe")
        })();

        // ============================================
        
        function Accepted() {
            document.getElementById('question-page').style.display = 'none';
            
            const successPage = document.getElementById('success-page');
            successPage.style.display = 'flex';
            
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('datePicker').setAttribute('min', today);
            
            createConfetti();
        }

        function kirimJawaban() {
            const dateValue = document.getElementById('datePicker').value;
            const messageValue = document.getElementById('messageInput').value;
            
            if (!dateValue) {
                alert('Pilih dulu tanggalnya dong! 🥺');
                return;
            }

            // Format tanggal Indonesia
            const dateObj = new Date(dateValue);
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const formattedDate = dateObj.toLocaleDateString('id-ID', options);

            // Tampilkan loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('kirimBtn').disabled = true;

            // Kirim email via EmailJS
            const templateParams = {
                date: formattedDate,
                message: messageValue || 'Tidak ada pesan'
            };

            // GANTI DENGAN SERVICE ID DAN TEMPLATE ID KAMU!
            emailjs.send('service_aucud2q', 'template_537cwg2', templateParams)
                .then(function(response) {
                    // Success
                    alert('Berhasil terkirim! \nKita jalan hari ' + formattedDate + ' ya!\n\nSee you cantik! ');
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('kirimBtn').disabled = false;
                })
                .catch(function(error) {
                    // Error
                    console.log('ERROR:', error);
                    alert('Maaf, ada kesalahan teknis 🥺\nTapi kita jalan hari ' + formattedDate + ' ya!\n\nSee you cantik! ');
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('kirimBtn').disabled = false;
                });
        }

        function runAway() {
            const btnNo = document.getElementById('btnNo');
            const randomX = Math.floor(Math.random() * 200) - 100;
            const randomY = Math.floor(Math.random() * 200) - 100;
            
            btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
            
            const texts = ["Yakin?", "Coba Lagi", "Kenapa?"];
            btnNo.innerText = texts[Math.floor(Math.random() * texts.length)];
            
            if (Math.abs(randomX) > 80 || Math.abs(randomY) > 80) {
                setTimeout(() => {
                    btnNo.style.transform = 'translate(0, 0)';
                    btnNo.innerText = "Gamau";
                }, 500);
            }
        }

        function createConfetti() {
            const pinkColors = ['#FF6B9D', '#FF9EBB', '#FFB7C5', '#FF85A2', '#FFCAD4', '#FF6B8A'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = pinkColors[Math.floor(Math.random() * pinkColors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                
                if (Math.random() > 0.5) {
                    confetti.style.borderRadius = '50%';
                } else {
                    confetti.innerHTML = '💖';
                    confetti.style.backgroundColor = 'transparent';
                    confetti.style.fontSize = (Math.random() * 10 + 10) + 'px';
                }
                
                document.body.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }
    </script>

</body>
</html>
